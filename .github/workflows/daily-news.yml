name: Daily Telegram News

on:
  # Cho phép bấm Run workflow để test bất kỳ lúc nào
  workflow_dispatch:

  # Chạy 07:30 mỗi ngày theo giờ Việt Nam
  schedule:
    - cron: "30 0 * * *"

jobs:
  send-daily-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send daily news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
